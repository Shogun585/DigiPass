services:
  postgres:
    image: postgres:16-alpine
    container_name: digipass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digipass}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - digipass-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-digipass}"]
      interval: 5s
      timeout: 5s
      retries: 5  

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: digipass-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_NAME: ${POSTGRES_DB:-digipass}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
    ports:
      - "6432:6432"
    networks:
      - digipass-net

networks:
  digipass-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
